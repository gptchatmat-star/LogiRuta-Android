name: Build LogiRuta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir LogiRuta
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'LogiRuta_Android_Source*.zip' -print -quit)"
          echo "Archivo encontrado: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          find extracted -maxdepth 2 -type f | head -50

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)"
          echo "Proyecto Android: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: LogiRuta-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
